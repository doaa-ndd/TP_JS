<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gestion des commandes</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link href="css/style.css" rel="stylesheet" />
  </head>
  <body>
    <main class="container py-4">
      <h1 class="mb-4">Gestion des commandes</h1>

      <div
        id="errorMessage"
        class="alert alert-danger d-none"
        role="alert"
      ></div>

      <section class="row g-3 mb-4" aria-label="Indicateurs">
        <div class="col-6 col-lg-3">
          <div class="card p-3">
            <strong>Clients</strong><span id="customerCount">0</span>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="card p-3">
            <strong>Produits</strong><span id="productCount">0</span>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="card p-3">
            <strong>Commandes</strong><span id="orderCount">0</span>
          </div>
        </div>
        <div class="col-6 col-lg-3">
          <div class="card p-3">
            <strong>Montant total</strong><span id="totalAmount">0 MAD</span>
          </div>
        </div>
      </section>

      <section class="row g-3 mb-4" aria-label="Recherche et filtres">
        <div class="col-md-4">
          <label for="searchInput" class="form-label"
            >Rechercher un client</label
          >
          <input
            id="searchInput"
            class="form-control"
            type="search"
            placeholder="Nom du client"
          />
        </div>
        <div class="col-md-4">
          <label for="statusFilter" class="form-label">Statut</label>
          <select id="statusFilter" class="form-select">
            <option value="all">Tous les statuts</option>
            <option value="Livree">Livrée</option>
            <option value="En attente">En attente</option>
            <option value="Annulee">Annulée</option>
          </select>
        </div>
        <div class="col-md-4">
          <label for="categoryFilter" class="form-label"
            >Catégorie de produit</label
          >
          <select id="categoryFilter" class="form-select">
            <option value="all">Toutes les catégories</option>
          </select>
        </div>
      </section>

      <section>
        <h2 class="h4">Commandes</h2>
        <div id="ordersList" class="row g-3"></div>
      </section>

      <section
        id="orderDetails"
        class="card p-3 mt-4 d-none"
        aria-live="polite"
      ></section>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
